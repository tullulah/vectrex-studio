# El envoltorio C de la capa de dibujo: lo que enlaza la imagen del multicart de Ralf.
#
# Existe SEPARADO del modelo por una razon dura, no por gusto: una `staticlib` exige un
# `#[panic_handler]`, y el firmware —que enlaza el modelo como `rlib`— ya trae el suyo
# (panic-probe). Dos manejadores en el mismo enlace es un error duro. Con la division,
# cada consumidor toma solo lo que necesita.
# INDEPENDIENTE del workspace del repositorio. Sin esto cargo la da por miembro del
# workspace raiz y se niega a compilarla ("believes it's in a workspace when it's not").
# Es una caja bare-metal con su propio objetivo; no tiene por que compartir perfil ni
# lockfile con las herramientas del IDE.
[workspace]

[package]
name = "vectrex-draw-cabi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
vectrex-draw = { path = ".." }
# Opcional: el stream de bus por PIO+DMA. Va en ESTE envoltorio y no en el suyo porque una
# staticlib exige manejador de panico y dos manejadores no pueden coexistir en un enlace.
vectrex-bus  = { path = "../../vectrex-bus", optional = true }

[features]
default = []
bus = ["dep:vectrex-bus"]

[profile.release]
panic = "abort"
opt-level = "s"

# EL MODELO DE RAMPA AQUI SE QUEDA EN "s", Y NO ES UN DESCUIDO (2026-09-21).
#
# El firmware del cartucho sube `vectrex-draw` a opt-level 3
# (hardware/debug_cart/firmware/Cargo.toml) y esa anulacion vale solo para SU enlace:
# cuando se construye una .um2, la raiz del build es ESTA caja y el modelo vuelve a
# compilarse en "s". Parece un despiste y se probo a igualarlo.
#
# MEDIDO: no compensa AQUI. En el cartucho la subida valio -3,2% (16.776 -> 16.233 ns por
# trazo) y su propia nota dice "no esperes mas de aqui" — es aritmetica entera sin nada que
# desenrollar. Pero la imagen crece, y una .um2 vive en 496 KB: con opt-level 3,
# aae_tomcatsw —que compilaba con 448 bytes de margen— DEJA DE CABER. Un 3% de una parte
# del llenado no vale un puerto que deja de construirse.
#
# Cuando los .um2 de doble nucleo dejen de cargar el LISTA_BUF muerto (98 KB, ver
# UVM2_LISTA_MAX en uvm2.mk) el margen sobrara y esto se puede volver a igualar.
