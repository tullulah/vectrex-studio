# LA CAPA DE BUS COMPARTIDA por los dos cartuchos: el stream por PIO y su anillo de DMA.
#
# Misma razon y misma forma que vectrex-draw, que ya se comparte asi. Aquello unifico el
# MODELO DE HAZ; esto unifica quien pone los bits en el bus. Sin esto, el UVM2 tendria su
# propio conductor en C y cada hallazgo habria que descubrirlo dos veces — que es
# exactamente lo que paso con la Recalibrate de la BIOS.
#
# Lo que se comparte no es solo el codigo: es la CALIBRACION. El `nop [14]` de
# bus_stream.pio, el orden de las dos esperas, los dos bits de centinela y el -1 del park
# repetido salieron de medidas en el osciloscopio contra la consola. Copiarlos a mano a
# otro fichero es garantizar que se separen.
#
#   rlib      -> lo enlaza el firmware del cartucho propio
#   staticlib -> libvectrex_bus_cabi.a, que CMake mete en la imagen .um2
[workspace]

[package]
name = "vectrex-bus"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
# SIN PAC A PROPOSITO: solo declara su dependencia de cortex-m para el objetivo de coma
# flotante HARDWARE, y esta caja tiene que compilar tambien softfp para la imagen .um2.
# Los registros van a pelo, con procedencia y con un guardia en el firmware. Ver lib.rs.
pio        = "0.2"
pio-proc   = "0.2"   # ensambla bus_stream.pio AQUI, para que las dos placas usen
                     # el mismo binario de PIO y no solo el mismo fuente

[profile.release]
panic = "abort"
opt-level = "s"
