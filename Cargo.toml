[workspace]
members = [
    "buildtools/vpy_parser",
    "buildtools/vpy_unifier", 
    "buildtools/vpy_codegen",
    "buildtools/vpy_assembler",
    "buildtools/vpy_bank_allocator",
    "buildtools/vpy_cli",
    "core",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Daniel Ferrer"]

[workspace.lints]
# Define empty lints table to satisfy inheritance

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true

# Fast iteration profile for run-ide.sh --fast — uses all CPU cores and skips
# LTO. Resulting binary is ~20% larger and a few percent slower than --release
# but compiles 3-5× faster. Runtime difference is imperceptible for local dev
# (compiling .vpy projects in the IDE). For shipping releases use --release.
[profile.dev-fast]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = false
strip = false
