[workspace]  # isolate from the VPy compiler workspace

[package]
name = "vectrex-cart"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vectrex-cart"
test = false
bench = false

[dependencies]
# RP2350 HAL + runtime (Pico 2)
rp235x-hal    = { version = "0.2", features = ["rt", "critical-section-impl"] }
cortex-m      = { version = "0.7" }
cortex-m-rt   = "0.7"
embedded-hal  = "1.0"

# USB CDC (serial over USB)
usb-device    = "0.3"
usbd-serial   = "0.2"

# Utilities
heapless      = "0.8"       # fixed-size collections (no alloc needed)
fugit         = "0.3"       # type-safe frequency/duration arithmetic
panic-halt    = "0.2"       # on panic: halt — swap for panic-probe when using SWD

[lints.rust]
warnings         = "deny"
unused_imports   = "deny"
unused_variables = "deny"
dead_code        = "deny"
unused_mut       = "deny"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
debug         = true        # keep debug symbols for probe-rs
