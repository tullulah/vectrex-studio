[package]
name = "vpy_lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "VPy language server (diagnostics, completion, hover, definition, semantic tokens, rename, signature help, code actions)"

[lints]
workspace = true

[lib]
name = "vpy_lsp"
path = "src/lib.rs"

[[bin]]
name = "vpy_lsp"
path = "src/main.rs"

[dependencies]
vpy_parser = { path = "../vpy_parser" }
# the AST walker every "where is X used" scan shares (m6809/ast_walk.rs)
vpy_codegen = { path = "../vpy_codegen" }
serde_json = "1.0"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
serde_json = "1.0"
